# https://taskfile.dev — a single entry point for the project's typical commands.
# Install:  winget install Task.Task  (or scoop install task).
# Task list: task --list

version: '3'

# The project is on Windows; test scripts are PowerShell 7. task picks the shell
# per platform, but we run .ps1 explicitly through pwsh so it doesn't depend on
# which comes first in PATH — powershell (5.1) or pwsh (7).
vars:
  PS: pwsh -NoProfile -ExecutionPolicy Bypass

tasks:
  default:
    desc: Show the task list
    cmds:
      - task --list

  install:
    desc: Install frontend dependencies (npm ci)
    cmds:
      - npm ci

  deps:
    desc: Same as install — a familiar name
    aliases: [install-deps]
    cmds:
      - task install

  dev:
    desc: Run the app in dev mode (Tauri + Vite with HMR)
    aliases: [run]
    cmds:
      - npm run tauri dev

  build:
    desc: Build the production NSIS installer + portable exe
    cmds:
      - npm run tauri build

  build:frontend:
    desc: Build only the frontend (vite build, without Tauri)
    cmds:
      - npm run build

  build:debug:
    desc: Build a Tauri debug binary (needed by the smoke test)
    cmds:
      - npm run tauri build -- --debug

  check:
    desc: Frontend type check (svelte-check)
    cmds:
      - npm run check

  schema:update:
    desc: 'Rebuild the sing-box config schema for the editor (requires network)'
    cmds:
      - npm run schema:update

  verify:editor:
    desc: 'Config editor checks: JSONC mode, hover resolution, signatures, validation'
    cmds:
      - npm run verify:editor

  check:rust:
    desc: cargo check (the backend compiles)
    # `dir: src-tauri` is mandatory: otherwise cargo won't find src-tauri/.cargo/config.toml
    # and will put artifacts in src-tauri/target (drive C:), not on D:. The service and
    # `npm run tauri` always go through the D: path — a desync risks a stale binary.
    dir: src-tauri
    cmds:
      - cargo check

  test:
    desc: Rust unit tests (no network, no sing-box)
    dir: src-tauri
    cmds:
      - cargo test --no-fail-fast

  test:live:
    desc: Integration test against an isolated sing-box (ports 19090/19080, no TUN)
    cmds:
      - '{{.PS}} -File scripts/integration-test.ps1 {{.CLI_ARGS}}'

  smoke:
    desc: 'Startup smoke test: tray, hotkeys, window, popup (requires a built binary)'
    cmds:
      - '{{.PS}} -File scripts/smoke-test.ps1 {{.CLI_ARGS}}'

  smoke:release:
    desc: Smoke test of the release build
    cmds:
      - '{{.PS}} -File scripts/smoke-test.ps1 -Release {{.CLI_ARGS}}'

  compat:
    desc: Compatibility matrix across sing-box versions
    cmds:
      - '{{.PS}} -File scripts/compat-matrix.ps1 {{.CLI_ARGS}}'

  verify:
    desc: Full local check before a commit (types + cargo check + tests)
    cmds:
      - task: check
      - task: verify:editor
      - task: check:rust
      - task: test

  fmt:
    desc: cargo fmt (backend)
    dir: src-tauri
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check that cargo fmt is already applied
    dir: src-tauri
    cmds:
      - cargo fmt -- --check

  clippy:
    desc: cargo clippy (backend, with tests)
    dir: src-tauri
    cmds:
      - cargo clippy --all-targets -- -D warnings

  clean:frontend:
    desc: Remove frontend artifacts (node_modules, .svelte-kit)
    cmds:
      - cmd: rm -rf node_modules .svelte-kit build
        platforms: [linux, darwin]
      - cmd: if exist node_modules rmdir /s /q node_modules & if exist .svelte-kit rmdir /s /q .svelte-kit & if exist build rmdir /s /q build
        platforms: [windows]

  clean:rust:
    desc: 'Remove Rust build artifacts (target on D: — see src-tauri/.cargo/config.toml)'
    dir: src-tauri
    cmds:
      - cargo clean

  clean:
    desc: Remove both frontend and backend artifacts
    cmds:
      - task: clean:frontend
      - task: clean:rust