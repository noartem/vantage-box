name: Build

# Сборка инсталлятора (NSIS) и портативной версии.
#
# - Релизы (тег v*): запускается автоматически. Версия берётся из тега и
#   прописывается во все манифесты, инсталлер подписывается, создаётся
#   draft-релиз с инсталлером, .sig и latest.json для автообновления; туда же
#   грузится портативный zip.
# - Не релизы: запускается вручную (workflow_dispatch). Собирает инсталлер и
#   портативку без публикации в релиз — оба доступны как артефакты прогона.
#
# Автопроверки (svelte-check, cargo test) идут здесь же: на тег-релиз ci.yml не
# срабатывает, поэтому сборка страхует сама себя.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# Релизную сборку не отменяем автоматом — пусть доработает до конца.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: svelte-check
        run: npm run check

      - name: cargo test
        # live_singbox — env-gated: без VANTAGE_BOX_TEST_SINGBOX тест ранним return'ом проходит впустую.
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      # На релизном теге синхронизируем версию во всех манифестах, чтобы NSIS,
      # метаданные exe и latest.json автообновления несли версию тега (а не
      # застывший 0.1.0 из tauri.conf.json). Regex-замена сохраняет форматирование.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "Version from tag: $ver"
          (Get-Content src-tauri/tauri.conf.json -Raw) `
            -replace '"version"\s*:\s*"[^"]*"', """version"": ""$ver""" `
            | Set-Content -NoNewline src-tauri/tauri.conf.json
          (Get-Content package.json -Raw) `
            -replace '"version"\s*:\s*"[^"]*"', """version"": ""$ver""" `
            | Set-Content -NoNewline package.json
          # В Cargo.toml ^version = "..." ловит только [package] — версии
          # зависимостей идут внутри строк `crate = { version = "..." }`.
          (Get-Content src-tauri/Cargo.toml -Raw) `
            -replace '(?m)^version = "[^"]*"', "version = `"$ver`"" `
            | Set-Content -NoNewline src-tauri/Cargo.toml

      # Релиз: tauri-action собирает NSIS, подписывает (секреты), создаёт
      # draft-релиз с инсталлером, .sig и latest.json для автообновления.
      - name: Build & publish (tauri-action)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vantage Box ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # Вручную (не тег): просто собираем бандл, без публикации и без latest.json.
      # Подпись накладывается, если задан TAURI_SIGNING_PRIVATE_KEY.
      - name: Build (manual, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - name: Locate built exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter 'vantage-box.exe' -File |
            Select-Object -First 1
          if (-not $exe) { throw "vantage-box.exe не найден в src-tauri/target/release" }
          Write-Host "Portable из $($exe.FullName)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # Инсталлер всегда доступен как артефакт прогона — и на релизе, и при ручном запуске.
      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantage-box-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build portable zip
        id: portable
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else { 'manual' }
          $zip = "vantage-box-portable-$ver.zip"
          Compress-Archive -Path ${{ steps.exe.outputs.path }} -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      # Релиз: портативка догружается в тот же draft-релиз.
      - name: Upload portable zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} ${{ steps.portable.outputs.zip }} --clobber

      # Всё загружено и проверки прошли — публикуем релиз (снимаем draft),
      # чтобы latest.json автообновления стал «живым» для пользователей.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false

      # Релиз снят с draft'а и виден в GitHub API — теперь дёргаем Scoop-бакет,
      # чтобы Excavator обновил манифест vantage-box через checkver/autoupdate.
      # Dispatch шлём именно после публикации, а не после tauri-action: пока
      # релиз был draft, checkver через GitHub API тег/релиз не увидит.
      # shell: bash — на windows-latest дефолтный pwsh делает `curl` алиасом
      # Invoke-WebRequest, который эти флаги не понимает.
      - name: Notify scoop bucket
        if: startsWith(github.ref, 'refs/tags/v') && success()
        shell: bash
        env:
          BUCKET_DISPATCH_TOKEN: ${{ secrets.BUCKET_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BUCKET_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/noartem/bucket/dispatches \
            -d '{"event_type":"new-release","client_payload":{"app":"vantage-box"}}'

      # Ручной запуск: портативка — как артефакт прогона.
      - name: Upload portable zip artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: vantage-box-portable
          path: ${{ steps.portable.outputs.zip }}
          if-no-files-found: error