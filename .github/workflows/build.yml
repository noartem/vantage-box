name: Build

# Build the installer (NSIS) and the portable version.
#
# - Releases (tag v*): runs automatically. The version is taken from the tag and
#   written into all manifests, the installer is signed, a draft release is created
#   with the installer, .sig and latest.json for auto-update; the portable zip is
#   uploaded there too.
# - Non-releases: runs manually (workflow_dispatch). Builds the installer and
#   portable zip without publishing to a release — both are available as run
#   artifacts.
#
# Self-checks (svelte-check, cargo test) run here as well: on a release tag ci.yml
# does not trigger, so the build insures itself.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# Don't auto-cancel a release build — let it run to completion.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: svelte-check
        run: npm run check

      - name: cargo test
        # live_singbox — env-gated: without VANTAGE_BOX_TEST_SINGBOX the test early-returns and passes vacuously.
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      # On a release tag, sync the version across all manifests so that NSIS,
      # the exe metadata and the auto-update latest.json carry the tag version (not
      # the frozen 0.1.0 from tauri.conf.json). The regex replacement preserves formatting.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "Version from tag: $ver"
          (Get-Content src-tauri/tauri.conf.json -Raw) `
            -replace '"version"\s*:\s*"[^"]*"', """version"": ""$ver""" `
            | Set-Content -NoNewline src-tauri/tauri.conf.json
          (Get-Content package.json -Raw) `
            -replace '"version"\s*:\s*"[^"]*"', """version"": ""$ver""" `
            | Set-Content -NoNewline package.json
          # In Cargo.toml ^version = "..." matches only [package] — dependency
          # versions live inside `crate = { version = "..." }` lines.
          (Get-Content src-tauri/Cargo.toml -Raw) `
            -replace '(?m)^version = "[^"]*"', "version = `"$ver`"" `
            | Set-Content -NoNewline src-tauri/Cargo.toml

      # Release: tauri-action builds NSIS, signs it (secrets), creates a draft
      # release with the installer, .sig and latest.json for auto-update.
      - name: Build & publish (tauri-action)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vantage Box ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # Manual (no tag): just build the bundle, no publishing and no latest.json.
      # Signing is applied if TAURI_SIGNING_PRIVATE_KEY is set.
      - name: Build (manual, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      # The console-subsystem CLI binary. Tauri only builds `mainBinaryName`
      # (`vantage-box`), so the dedicated `vantage-box-cli` bin is compiled
      # separately and shipped alongside it in the portable zip. The NSIS
      # installer stays GUI-only (the CLI is distributed via scoop/zip).
      - name: Build console CLI binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin vantage-box-cli

      - name: Locate built exes
        id: exe
        shell: pwsh
        run: |
          $gui = Get-ChildItem -Path src-tauri/target/release -Filter 'vantage-box.exe' -File |
            Select-Object -First 1
          if (-not $gui) { throw "vantage-box.exe not found in src-tauri/target/release" }
          $cli = Get-ChildItem -Path src-tauri/target/release -Filter 'vantage-box-cli.exe' -File |
            Select-Object -First 1
          if (-not $cli) { throw "vantage-box-cli.exe not found in src-tauri/target/release" }
          Write-Host "Portable from $($gui.FullName) + $($cli.FullName)"
          "gui=$($gui.FullName)" >> $env:GITHUB_OUTPUT
          "cli=$($cli.FullName)" >> $env:GITHUB_OUTPUT

      # The installer is always available as a run artifact — both on a release and on a manual run.
      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantage-box-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build portable zip
        id: portable
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else { 'manual' }
          $zip = "vantage-box-portable-$ver.zip"
          # Both the GUI binary and the console CLI binary ship in the zip;
          # the scoop manifest exposes each as its own shim.
          Compress-Archive -Path ${{ steps.exe.outputs.gui }},${{ steps.exe.outputs.cli }} -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      # Release: the portable zip is uploaded to the same draft release.
      - name: Upload portable zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} ${{ steps.portable.outputs.zip }} --clobber

      # Everything is uploaded and checks passed — publish the release (drop the draft),
      # so the auto-update latest.json becomes "live" for users.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false

      # The release is no longer a draft and is visible in the GitHub API — now poke the
      # Scoop bucket so Excavator updates the vantage-box manifest via checkver/autoupdate.
      # The dispatch is sent after publishing, not after tauri-action: while the release
      # was a draft, checkver via the GitHub API couldn't see the tag/release.
      # shell: bash — on windows-latest the default pwsh makes `curl` an alias for
      # Invoke-WebRequest, which doesn't understand these flags.
      - name: Notify scoop bucket
        if: startsWith(github.ref, 'refs/tags/v') && success()
        shell: bash
        env:
          BUCKET_DISPATCH_TOKEN: ${{ secrets.BUCKET_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BUCKET_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/noartem/bucket/dispatches \
            -d '{"event_type":"new-release","client_payload":{"app":"vantage-box"}}'

      # Manual run: the portable zip is a run artifact.
      - name: Upload portable zip artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: vantage-box-portable
          path: ${{ steps.portable.outputs.zip }}
          if-no-files-found: error