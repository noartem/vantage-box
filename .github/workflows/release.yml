name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-action собирает NSIS, подписывает его (нужны секреты), и грузит в
      # релиз инсталлер + .sig + latest.json для автообновления.
      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vantage Box ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # Portable-сборка: собранный .exe без инсталлера, для тех, кто не любит NSIS.
      - name: Portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter "vantage-box.exe" |
            Where-Object { $_.DirectoryName -notmatch '\\(deps|build|examples|incremental)' } |
            Select-Object -First 1
          if (-not $exe) { throw "vantage-box.exe не найден в src-tauri/target" }
          Write-Host "zip из $($exe.FullName)"
          Compress-Archive -Path $exe.FullName -DestinationPath vantage-box-portable.zip

      - name: Upload portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} vantage-box-portable.zip --clobber