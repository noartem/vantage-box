name: CI

# Fast checks on every push/PR: svelte-check and cargo test.
# Building the installer and portable zip is in build.yml (manual for non-releases,
# automatic for v* tags).

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs of the same push — the build is heavy, no point running them in vain.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: svelte-check
        run: npm run check

      - name: cargo test
        # live_singbox — env-gated: without VANTAGE_BOX_TEST_SINGBOX the test early-returns and passes vacuously.
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      # The installer and portable zip build itself lives in build.yml: for non-releases
      # it runs manually (workflow_dispatch), for releases (tag v*) — always.
      # Here only the fast checks that catch regressions on every push/PR.