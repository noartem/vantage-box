[package]
name = "vantage-box"
version = "0.1.0"
description = "A minimalist desktop GUI for sing-box"
authors = ["Vantage Box"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vantage_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: the runtime copy of the config must differ from the user's
# file as little as possible. Without it, serde_json rebuilds objects in
# alphabetical order, and line numbers in sing-box output would no longer
# match the original file.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3.33"
notify = "8.2.0"
thiserror = "2.0.19"
dirs = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "stream", "query"] }
getrandom = "0.4.3"
sha2 = "0.11.0"
base64 = "0.22.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# CLI subcommand (`vantage-box.exe cli …`): typed args, --json/--wait/--help.
clap = { version = "4", features = ["derive", "string"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
# Raw Win32 bindings for the named-pipe ACL (current-user + LocalSystem DACL).
# `windows-sys` mirrors the `windows` version `windows-service` already pulls in,
# so this stays light and avoids a second copy of the high-level crate.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
]}

# `desktop` is a cfg from tauri-build; cargo does not know it for dependency
# selection, so we list the platforms explicitly.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

